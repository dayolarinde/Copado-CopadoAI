name: Deploy

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate a deploy failure instead of success"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate deploy work
        run: |
          echo "Pretending to deploy..."
          sleep 5

      - name: Fail on purpose if requested
        if: ${{ github.event.inputs.simulate_failure == 'true' }}
        run: |
          echo "Simulating a deploy failure for testing."
          exit 1

      - name: Succeed
        if: ${{ github.event.inputs.simulate_failure != 'true' }}
        run: echo "Deploy simulated successfully."
