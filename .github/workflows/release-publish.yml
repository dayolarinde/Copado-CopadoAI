name: Release - Publish

# Publishes a release in two places:
#   - GitHub: a Release page for the branch, holding the notes and a status block
#     that the Deploy workflow keeps current as the release moves through stages
#   - Jira: a release version named after the branch, with the notes in its
#     description and Fix Version set on every ticket found in the PRs' branch names
#
# This is a deliberate step, separate from Release - Notes, so the notes get
# reviewed before they land in Jira. Safe to re-run after more PRs merge: it
# updates the existing GitHub release and Jira version instead of creating new ones.
#
# Needs repo secrets: JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN, JIRA_PROJECT_KEY,
# SLACK_WEBHOOK_URL. Creating a Jira version needs the Administer Projects
# permission (or Jira admin) for that project on the account behind the token.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Release branch name"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install script dependencies
        working-directory: .release-agent/scripts
        run: npm install

      - name: Publish release
        working-directory: .release-agent/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: node publish-release.js "${{ inputs.branch }}"

      - name: Commit release state
        run: |
          git config user.name "release-agent"
          git config user.email "release-agent@users.noreply.github.com"
          git add .release-agent/releases/
          git diff --staged --quiet || git commit -m "Publish release: ${{ inputs.branch }}"
          git pull --rebase origin ${{ github.event.repository.default_branch }}
          git push
